server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: jiuwan
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
jiuwan:
  storage:
    mode: ${STORAGE_MODE:redis}
    memory-max-rooms: ${MEMORY_MAX_ROOMS:1000}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}
